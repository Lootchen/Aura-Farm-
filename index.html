<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080b12">
  <title>Aura Farm — Mechanics Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <canvas id="game" width="540" height="960" aria-label="Prototipo de juego rítmico"></canvas>

    <div class="topbar" aria-live="polite">
      <div><span>PUNTOS</span><strong id="score">0</strong></div>
      <div><span>COMBO</span><strong id="combo">0</strong></div>
      <div><span>ÚLTIMO</span><strong id="lastHit">—</strong></div>
    </div>

    <div class="controls" aria-label="Controles de pinzas">
      <button id="leftButton" type="button"><span class="control-key">A</span><span class="control-label">PINZA IZQ</span></button>
      <button id="rightButton" type="button"><span class="control-key">D</span><span class="control-label">PINZA DER</span></button>
    </div>

    <section id="startPanel" class="start-panel">
      <h1>Aura Farm</h1>
      <p>Tap v0.8: chart por beats, controles táctiles integrados y proyectiles que explotan al chocar.</p>
      <button id="startButton" type="button">INICIAR PRUEBA</button>
      <small>A / D o toca las zonas inferiores. H muestra el debug.</small>
    </section>
  </main>

  <script type="module" src="./src/main.js?v=0.8"></script>
</body>
</html>

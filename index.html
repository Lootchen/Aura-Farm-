<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080b12">
  <title>Aura Farm — Mechanics Lab</title>
  <link rel="stylesheet" href="./styles.css?v=0.11">
</head>
<body>
  <main class="app">
    <canvas id="game" width="540" height="960" aria-label="Prototipo de juego rítmico"></canvas>

    <div class="topbar" aria-live="polite">
      <div><span>PUNTOS</span><strong id="score">0</strong></div>
      <div><span>COMBO</span><strong id="combo">0</strong></div>
      <div><span>ÚLTIMO</span><strong id="lastHit">—</strong></div>
    </div>

    <div class="controls" aria-label="Controles de pinzas">
      <button id="leftButton" class="touch-zone left-touch" type="button" aria-label="Pinza izquierda"></button>
      <button id="rightButton" class="touch-zone right-touch" type="button" aria-label="Pinza derecha"></button>
    </div>

    <section id="startPanel" class="start-panel">
      <h1>Aura Farm</h1>
      <p>Lab v0.11: Tap + Slide + Magic en un mismo chart musical. Pulsa las pinzas, sigue las rutas y dibuja las constelaciones.</p>
      <button id="startButton" type="button">INICIAR PRUEBA</button>
      <small>A / D para Tap. Slide y Magic se juegan directamente sobre la pantalla. H muestra el debug.</small>
    </section>
  </main>

  <script type="module" src="./src/main.js?v=0.11"></script>
</body>
</html>

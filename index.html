<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080b12">
  <title>Aura Farm — Mechanics Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <canvas id="game" width="540" height="960" aria-label="Prototipo de juego rítmico"></canvas>

    <div class="topbar" aria-live="polite">
      <div><span>PUNTOS</span><strong id="score">0</strong></div>
      <div><span>COMBO</span><strong id="combo">0</strong></div>
      <div><span>ÚLTIMO</span><strong id="lastHit">—</strong></div>
    </div>

    <div class="controls" aria-label="Controles de pinzas">
      <button id="leftButton" type="button">IZQ</button>
      <button id="rightButton" type="button">DER</button>
    </div>

    <section id="startPanel" class="start-panel">
      <h1>Aura Farm</h1>
      <p>Tap v0.7: sin guías visibles; la punta de la pinza es el receptor y los aciertos pueden colisionar.</p>
      <button id="startButton" type="button">INICIAR PRUEBA</button>
      <small>También puedes usar A / D o ← / →.</small>
    </section>
  </main>

  <script type="module" src="./src/main.js?v=0.7"></script>
</body>
</html>
